<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Strade 2030 · Commissione · Thinking of Campania</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚜️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=26">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand" id="brand"></div>
    <nav class="tabs hidden" id="tabs" role="tablist">
      <button role="tab" data-view="local" aria-selected="true">Locali</button>
      <button role="tab" data-view="future" aria-selected="false">Futuro</button>
      <button role="tab" data-view="req" aria-selected="false">Richieste</button>
      <button role="tab" data-view="clans" aria-selected="false">Comunità R/S</button>
    </nav>
    <button class="btn ghost small hidden" id="refresh">Aggiorna</button>
    <button class="btn ghost small hidden" id="pwBtn">Cambia password</button>
    <button class="btn ghost small hidden" id="logout">Esci</button>
  </div>
</header>
<main class="wrap" id="app"><p class="muted" style="padding:60px 0">Caricamento…</p></main>
<dialog id="pwDlg" class="spirit" aria-labelledby="pwTitle">
  <form class="spirit-body stack" id="pwForm" method="dialog">
    <p class="kicker">Commissione</p>
    <h2 id="pwTitle">Cambia password</h2>
    <p class="muted small">Vale solo per il tuo account. Almeno 8 caratteri, meglio se lunga e diversa da quelle che usi altrove.</p>
    <label class="f">Nuova password<input type="password" id="pwNew" minlength="8" required autocomplete="new-password"></label>
    <label class="f">Ripeti la nuova password<input type="password" id="pwNew2" minlength="8" required autocomplete="new-password"></label>
    <p class="error hidden" id="pwErr" role="alert"></p>
    <div class="row-actions"><button class="btn" id="pwSave" type="submit">Salva la nuova password</button><button class="btn ghost" type="button" id="pwCancel">Annulla</button></div>
  </form>
</dialog>
<div class="toast hidden" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="config.js?v=26"></script>
<script src="assets/goals.js?v=26"></script>
<script src="assets/common.js?v=26"></script>
<script src="assets/commissione.js?v=26"></script>
</body>
</html>
